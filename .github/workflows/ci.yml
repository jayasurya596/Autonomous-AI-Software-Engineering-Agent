name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg17-bookworm
        env:
          POSTGRES_DB: software_agent
          POSTGRES_USER: software_agent
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U software_agent -d software_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://software_agent:ci-test-password@127.0.0.1:5432/software_agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra firebase --extra agents --extra database --group dev
      - run: uv run ruff check backend
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Verify durable approvals against PostgreSQL
        run: uv run pytest backend/tests/test_phase10_approval_live.py -q
        env:
          RUN_PHASE10_LIVE_TESTS: "1"
      - name: Audit installed Python dependencies
        run: uv run --with pip-audit pip-audit --local --strict

  firebase-emulators:
    name: Firebase Auth and Firestore emulator integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      FIREBASE_PROJECT_ID: demo-software-agent
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --extra firebase --extra agents --extra database --group dev
      - name: Verify Firebase emulator flows
        run: >-
          npx --yes firebase-tools@15.35.0 emulators:exec
          --only auth,firestore --project demo-software-agent
          "uv run pytest backend/tests/test_auth_emulator.py backend/tests/test_firestore_api.py backend/tests/test_firestore_rules_api.py -q"

  frontend:
    name: Frontend build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
